name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run python scripts/sync_spec.py --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  reference-world:
    name: awp-sim through the CLI (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [streaming, lockstep]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - name: serve awp-sim and run the suite against it
        run: |
          mkdir -p run && cd run
          uv run awp-sim serve --mode ${{ matrix.mode }} --port 8710 \
            --watchdog-ms 800 --heartbeat-ms 500 --reconnect-window-ms 4000 &
          export AWP_SIM_PID=$!
          sleep 2
          sed 's#"audit_dir": "awp-audit"#"audit_dir": "'"$PWD"'/awp-audit"#' ../fixtures/awp-sim.json > fixture.json
          uv run awp-conformance world ws://127.0.0.1:8710 --fixture fixture.json --out report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.mode }}
          path: run/report/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uvx twine check dist/*
      - name: install the wheel in a clean environment
        run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel dist/*.whl
          /tmp/wheel/bin/awp-conformance --version
          /tmp/wheel/bin/awp-conformance requirements | wc -l
